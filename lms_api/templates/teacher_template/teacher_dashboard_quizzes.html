{% extends 'teacher_template/t_basepage.html' %} {% block title %}Quizzes - BICTE-LMS{% endblock %} {% block content %}
<div class="container">
    <h4 class="text-center fw-bold">Quizzes</h4>
    <a href="{% url 'teacher-create-quiz' %}" class="btn btn-primary mb-3">Create New Quiz</a
  >
  <table class="table table-bordered ">
    <thead>
      <tr>
        <th>Title</th>
        <th>Course</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for quiz in quizzes %}
      <tr>
        <td>{{ quiz.title }}</td>
        <td>{{ quiz.course.title }}</td>
        <td>
          <a
            href="{% url 'teacher-quiz-detail' quiz.id %} "
            class="btn btn-info btn-sm "
            >View</a
          >
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
