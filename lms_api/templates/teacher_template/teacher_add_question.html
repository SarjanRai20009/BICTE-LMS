{% extends 'teacher_template/t_basepage.html' %} {% block title %}Add Question - BICTE-LMS{% endblock %} {% block content %}
<div class="container">
    <h2>Add Question to {{ quiz.title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="text">Question Text</label>
            <textarea class="form-control" id="text" name="text" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label for="option1">Option 1</label>
            <input type="text" class="form-control" id="option1" name="option1" required>
        </div>
        <div class="form-group">
            <label for="option2">Option 2</label>
            <input type="text" class="form-control" id="option2" name="option2" required>
        </div>
        <div class="form-group">
            <label for="option3">Option 3 (Optional)</label>
            <input type="text" class="form-control" id="option3" name="option3">
        </div>
        <div class="form-group">
            <label for="option4">Option 4 (Optional)</label>
            <input type="text" class="form-control" id="option4" name="option4">
        </div>
        <div class="form-group">
            <label for="correct_option">Correct Option</label>
            <select class="form-control" id="correct_option" name="correct_option" required>
                <option value="1">Option 1</option>
                <option value="2">Option 2</option>
                <option value="3">Option 3</option>
                <option value="4">Option 4</option>
            </select>
        </div>
        <div class="form-group">
            <label for="marks">Marks</label>
            <input type="number" class="form-control" id="marks" name="marks" min="1" max="10" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Question</button>
    </form>
</div>
{% endblock %}
